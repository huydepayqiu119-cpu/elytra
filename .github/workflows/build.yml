name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.10

      - name: Build
        run: ./gradlew shadowJar

      - name: Upload Spigot plugin
        uses: actions/upload-artifact@v4
        with:
          name: ElytraSpigot
          path: spigot/build/libs/ElytraSpigot-*.jar
          if-no-files-found: error

      - name: Upload Geyser extension
        uses: actions/upload-artifact@v4
        with:
          name: ElytraGeyser
          path: geyser/build/libs/ElytraGeyser-*.jar
          if-no-files-found: error
